name: "assert rle_decompress"
limit: 5000
memory_size: 0x800
memory_mapped_io:
  0x80: [51, 65, 52, 66, 52, 67, 10]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      {pc}: {instruction} {pc:label}
      D0={D0:hex} D1={D1:hex} D3={D3:hex} A0={A0:hex} A2={A2:hex} A3={A3:hex} A7={A7:hex}
  - name: Result
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
      symio[0x80]: {io:0x80:sym}
      symio[0x84]: {io:0x84:sym}
      {memory:0:15}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [65,65,65,66,66,66,66,67,67,67,67]
      symio[0x80]: "" >>> ""
      symio[0x84]: "" >>> "AAABBBBCCCC"
      mem[0..15]: 	41 41 41 42 42 42 42 43 43 43 43 00 5f 5f 5f 5f
