name: "assert sum_word_pstream"
limit: 5000
memory_size: 0x400
memory_mapped_io:
  0x80: [4, 2147483647, 1, 2147483647, 2, 0]
  0x84: []
reports:
  - name: Step-by-step
    slice: all
    view: |
      T S A B {T:hex} {S:hex} {A:hex} {B:hex} R {R:hex}
      stack: {stack:hex}
      rstack: {rstack:hex}
      {pc}: {instruction} {pc:label}
  - name: Result
    slice: last
    filter:
      - state
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [0] >>> []
      numio[0x84]: [] >>> [1,1]
